name: Build Matibo English Coach APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MatiboEnglishCoach_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip MatiboEnglishCoach_Project.zip -d project

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" in s:
              start = s.index("compileOptions {")
              end = s.index("}", start)
              block = s[start:end]
              import re
              block = re.sub(
                  r"sourceCompatibility\s*=\s*JavaVersion\.[A-Z0-9_]+",
                  "sourceCompatibility = JavaVersion.VERSION_17",
                  block
              )
              block = re.sub(
                  r"targetCompatibility\s*=\s*JavaVersion\.[A-Z0-9_]+",
                  "targetCompatibility = JavaVersion.VERSION_17",
                  block
              )
              if "sourceCompatibility" not in block:
                  block += "\n        sourceCompatibility = JavaVersion.VERSION_17"
              if "targetCompatibility" not in block:
                  block += "\n        targetCompatibility = JavaVersion.VERSION_17"
              s = s[:start] + block + s[end:]

          else:
              s = s.replace(
                  "android {",
                  "android {\n    compileOptions {\n"
                  "        sourceCompatibility = JavaVersion.VERSION_17\n"
                  "        targetCompatibility = JavaVersion.VERSION_17\n"
                  "    }",
                  1
              )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibo-English-Coach-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk

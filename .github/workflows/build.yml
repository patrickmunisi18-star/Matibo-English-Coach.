
name: Build Matibo English Coach APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MatiboEnglishCoach_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip MatiboEnglishCoach_Project.zip -d project

            - name: Fix Java and Kotlin JVM targets
        run: |
          FILE=$(find project -name "build.gradle.kts" -path "*/app/*" | head -n 1)
          sed -i '/compileOptions {/a\        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17' "$FILE"
          sed -i '/kotlinOptions {/a\        jvmTarget = "17"' "$FILE"

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibo-English-Coach-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
